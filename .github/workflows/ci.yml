name: CI

permissions:
  contents: read
  pull-requests: read
  actions: read

defaults:
  run:
    shell: bash

on:
  push:
    branches:
      - 'main'
      - 'branch-v*.*'
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "**.mdx"
      - "**.png"
      - "**.jpg"
      - ".github/workflows/cmd.yml"
      - ".github/workflows/prune.yml"
      - ".github/workflows/sync.yml"
  pull_request:
    branches:
      - 'main'
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "**.mdx"
      - "**.png"
      - "**.jpg"
      - ".github/workflows/cmd.yml"
      - ".github/workflows/prune.yml"
      - ".github/workflows/sync.yml"

jobs:
  ci:
    # The test step alone runs for 13 minutes on a good day, because the
    # library suite talks to the model registries. The job needs room for
    # that plus the cross-compiled build, which lands at about 15 minutes
    # in total and was cancelled by the old 15 minute limit.
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Go
        timeout-minutes: 15
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.9"
          cache-dependency-path: |
            **/go.sum
      - name: Setup Toolbox
        timeout-minutes: 5
        uses: actions/cache@v4
        with:
          key: toolbox-${{ runner.os }}
          path: |
            ${{ github.workspace }}/.sbin
      - name: Make
        run: make ci
        env:
          LINT_DIRTY: "true"
