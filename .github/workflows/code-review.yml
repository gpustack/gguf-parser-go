# This workflow runs AI code review on pull requests by calling the reusable workflow in
# gpustack/.github. The review mechanics — GitHub App token and comment posting — live
# there; this file owns the triggers, the trigger gating, the concurrency group, and this
# repository's review configuration: the secrets mapping and the LLM inputs below
# (endpoint/model/thinking/reasoning-effort from org variables).
#
# Aligned with upstream:
# https://github.com/alibaba/open-code-review/blob/main/examples/github_actions/ocr-review.yml

name: Code Review

permissions:
  contents: read
  pull-requests: write

# Conditional concurrency group.
#
# GitHub Actions evaluates concurrency BEFORE job-level if-conditions. With a
# flat group (ocr-<pr_number>), every comment on the PR — even an unrelated
# conversation reply that will be skipped — enters the same group and, because
# cancel-in-progress is true, cancels any in-progress review. The result: a
# single normal comment kills a running review, and you see "two runs, one
# cancelled" in the Actions tab.
#
# Fix: matching events (PR events + /open-code-review comments) share a per-PR
# group so a new review cancels any stale one for the same PR. Non-matching
# comments land in a unique noop-<run_id> group that can never collide with a
# real review, so they are skipped instantly without disrupting anything.
concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request_target'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            startsWith(github.event.comment.body, '/open-code-review')
            || startsWith(github.event.comment.body, '@open-code-review')
          )
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

on:
  # Use pull_request_target instead of pull_request so that secrets are
  # available even for PRs from forks. This is safe because the reusable
  # workflow only reads the diff and does not execute any code from the PR.
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  review:
    # Run on PR events, or on human-authored comments starting with trigger
    # keywords. Bot comments are excluded as a safety net: GITHUB_TOKEN already
    # suppresses events from bot-posted comments, but a PAT/App token would not.
    # issue_comment triggers are further gated on author_association so only
    # MEMBER/OWNER/COLLABORATOR users can spend LLM quota via re-review.
    if: |
      github.event_name == 'pull_request_target'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
        )
      )
    uses: gpustack/.github/.github/workflows/code-review.yml@main
    with:
      # This repository's review backing: the org-level LLM endpoint/model
      # (OCR appends /chat/completions to the base URL), thinking mode, and
      # reasoning effort.
      llm-url: "${{ vars.CI_GPUSTACK_CODEREVIEW_LLM_URL }}"
      llm-model: "${{ vars.CI_GPUSTACK_CODEREVIEW_LLM_MODEL }}"
      llm-thinking: "${{ vars.CI_GPUSTACK_CODEREVIEW_LLM_THINKING }}"
      llm-reasoning-effort: "${{ vars.CI_GPUSTACK_CODEREVIEW_LLM_REASONING_EFFORT }}"
      llm-temperature: "${{ vars.CI_GPUSTACK_CODEREVIEW_LLM_TEMPERATURE }}"
      llm-top-p: "${{ vars.CI_GPUSTACK_CODEREVIEW_LLM_TOP_P }}"
      llm-thinking-clear: "${{ vars.CI_GPUSTACK_CODEREVIEW_LLM_THINKING_CLEAR }}"
    secrets:
      llm-auth-token: ${{ secrets.CI_GPUSTACK_CODEREVIEW_LLM_AUTH_TOKEN }}
      app-id: ${{ secrets.CI_GPUSTACK_CODEREVIEW_APP_ID }}
      app-private-key: ${{ secrets.CI_GPUSTACK_CODEREVIEW_APP_PRIVATE_KEY }}
